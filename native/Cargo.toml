[package]
name = "lyrics-overlay"
version = "0.2.0"
description = "Synced lyrics floating over your Windows desktop, for whatever is playing. Native Rust build."
authors = ["AhPlace2"]
license = "AGPL-3.0-or-later"
edition = "2021"

[dependencies]
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
egui-winit = { version = "0.37", default-features = false, features = ["clipboard"] }
winit = "0.30"
# The "dx12" feature (on by default): draw on the graphics card.
egui-wgpu = { version = "0.37", default-features = false, optional = true }
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "dx12"], optional = true }
pollster = { version = "0.4", optional = true }
tray-icon = "0.26"
global-hotkey = "0.10"
serde_json = { version = "1", features = ["preserve_order"] }
ureq = { version = "3", features = ["json"] }
regex = "1"
unicode-normalization = "0.1"
sha1 = "0.10"
sha2 = "0.10"
crc32fast = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
cpal = "0.15"
raw-window-handle = "0.6"

[features]
# Draw on the graphics card (Direct3D 12), falling back to the CPU when it can't. Build without it
# (--no-default-features) for a CPU-only exe.
default = ["dx12"]
dx12 = ["dep:egui-wgpu", "dep:wgpu", "dep:pollster"]

[dependencies.windows]
version = "0.62"
features = [
  "Foundation",
  "Foundation_Collections",
  "Media_Control",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_WinRT",
  "Win32_System_Com",
]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
