<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data:">
<title>Lyrics Overlay</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Instrument+Serif:ital@0;1&family=Pixelify+Sans:wght@400;600;700&display=swap">
<link rel="stylesheet" href="overlay.css">
</head>
<body class="font-clean">
  <div id="grid" class="grid"></div>
  <div id="guide-x" class="guide guide-x"></div>
  <div id="guide-y" class="guide guide-y"></div>
  <div id="card" class="card hidden">
    <div class="now">
      <div class="cover"><img id="cover" alt=""></div>
      <div class="meta">
        <div id="title" class="title"></div>
        <div id="artist" class="artist"></div>
        <div id="bar" class="bar hit" title="Drag to jump to a time"><div class="track"><i id="fill"></i></div><b id="knob"></b></div>
        <div class="progress">
          <span id="elapsed">0:00</span>
          <div class="controls">
            <button id="prev" class="ctl hit" type="button" title="Previous" aria-label="Previous">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h2v14H7zM19 5.8v12.4a.8.8 0 0 1-1.2.7L9.6 12.7a.8.8 0 0 1 0-1.4l8.2-6.2a.8.8 0 0 1 1.2.7z"/></svg>
            </button>
            <button id="play" class="ctl hit main" type="button" title="Pause" aria-label="Play or pause">
              <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
              <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.6v12.8a.8.8 0 0 0 1.2.7l10-6.4a.8.8 0 0 0 0-1.4l-10-6.4A.8.8 0 0 0 8 5.6z"/></svg>
            </button>
            <button id="next" class="ctl hit" type="button" title="Next" aria-label="Next">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5h2v14h-2zM5 5.8v12.4a.8.8 0 0 0 1.2.7l8.2-6.2a.8.8 0 0 0 0-1.4L6.2 5.1A.8.8 0 0 0 5 5.8z"/></svg>
            </button>
          </div>
          <span id="length">0:00</span>
        </div>
      </div>
      <div class="side">
        <button id="gear" class="gear hit" type="button" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.4-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3.3h-4l-.4 2.7a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.4L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.4 2.5-1a7.4 7.4 0 0 0 1.7 1l.4 2.7h4l.4-2.7a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.4zM13 15.2a3.2 3.2 0 1 1 0-6.4 3.2 3.2 0 0 1 0 6.4z" transform="translate(-1 0)"/></svg>
        </button>
        <div id="eq" class="eq"><i></i><i></i><i></i></div>
      </div>
    </div>
    <div id="panel" class="panel"></div>
    <div class="edit-hint"><span>Drag the card where you want it<small>Snaps to lines and the grid. Hold Alt to move freely.</small></span> <button id="done" type="button">Done</button></div>
  </div>
  <div id="big" class="big look-depth colour-accent motion-none"></div>
  <div id="toast" class="toast"></div>
  <script src="overlay.js"></script>
</body>
</html>
